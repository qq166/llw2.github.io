<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
<title>简易网页MC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87CEEB;font-family:system-ui}
#info{position:absolute;top:8px;left:8px;color:#000;background:rgba(255,255,255,0.7);padding:8px;border-radius:8px;z-index:99}
#blockSel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:99}
.blockItem{width:44px;height:44px;border:2px solid #333;border-radius:6px}
#canvas{display:block}
</style>
</head>
<body>
<div id="info">
左键：放置方块 | 右键：删除方块<br>
方块选择底部按钮
</div>
<div id="blockSel">
    <div class="blockItem" style="background:#966c4a" onclick="setBlock('dirt')"></div>
    <div class="blockItem" style="background:#888" onclick="setBlock('stone')"></div>
    <div class="blockItem" style="background:#2e7d32" onclick="setBlock('grass')"></div>
</div>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script>
// 初始化Three.js场景
let scene,camera,renderer;
let blockMap = new Map();
let currentBlock = "dirt";

//方块颜色
const blockColor = {
    dirt:0x966c4a,
    stone:0x888888,
    grass:0x2e7d32
}

function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
    camera.position.set(0,8,12);

    renderer = new THREE.WebGLRenderer({canvas:document.getElementById("canvas")});
    renderer.setSize(window.innerWidth,window.innerHeight);

    const light = new THREE.AmbientLight(0xffffff,0.8);
    scene.add(light);
    const dirLight = new THREE.DirectionalLight(0xffffff,0.6);
    dirLight.position.set(10,20,10);
    scene.add(dirLight);

    //地面
    for(let x=-5;x<=5;x++){
        for(let z=-5;z<=5;z++){
            addBlock(x,0,z,"grass");
        }
    }

    //射线检测
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let mouseDown = false;
    let isRight = false;

    canvas.addEventListener("mousedown",e=>{
        mouseDown=true;
        isRight = (e.button===2);
    })
    canvas.addEventListener("mouseup",()=>mouseDown=false)
    canvas.addEventListener("contextmenu",e=>e.preventDefault())

    canvas.addEventListener("mousemove",e=>{
        mouse.x = (e.clientX/window.innerWidth)*2-1;
        mouse.y = -(e.clientY/window.innerHeight)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const intersects = raycaster.intersectObjects(scene.children);
        if(intersects.length>0 && mouseDown){
            const hit = intersects[0];
            if(isRight){
                // 删除方块
                const obj = hit.object;
                scene.remove(obj);
                blockMap.delete(obj.userData.key);
            }else{
                //放置方块
                const p = hit.point.add(hit.face.normal).round();
                addBlock(p.x,p.y,p.z,currentBlock);
            }
        }
    })

    window.addEventListener("resize",()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth,window.innerHeight);
    })
    animate();
}

function addBlock(x,y,z,type){
    const key = `${x},${y},${z}`;
    if(blockMap.has(key))return;
    const geo = new THREE.BoxGeometry(1,1,1);
    const mat = new THREE.MeshLambertMaterial({color:blockColor[type]});
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.set(x,y,z);
    mesh.userData.key = key;
    scene.add(mesh);
    blockMap.set(key,mesh);
}

function setBlock(name){
    currentBlock = name;
}

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

init();
</script>
</body>
</html>
